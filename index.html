<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escala UPA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&display=swap" rel="stylesheet">
<style>
  :root{
    --verde:#0E6B5C; --fundo:#F5F8F7; --card:#FFFFFF; --texto:#1C2B28;
    --texto-suave:#5E6E6A; --linha:#E3EAE8; --chip:#EDF2F0;
    --sol-bg:#FFF4DC; --sol-tx:#8A5A00; --sol-borda:#F0D9A0;
    --lua-bg:#E6E9FB; --lua-tx:#3B3F8C; --lua-borda:#C7CCF0;
    --apoio-bg:#DDF2EE; --apoio-tx:#0E6B5C;
    --agora-d1:#FFFBEF; --agora-d2:#FFF2D6;
  }
  body[data-tema="escuro"]{
    --verde:#17987F; --fundo:#111917; --card:#1A2422; --texto:#E8EFED;
    --texto-suave:#93A5A0; --linha:#2A3835; --chip:#22302D;
    --sol-bg:#3A2E10; --sol-tx:#F5C96B; --sol-borda:#5A4A1E;
    --lua-bg:#23264D; --lua-tx:#B9BEF5; --lua-borda:#3B3F8C;
    --apoio-bg:#14332D; --apoio-tx:#6FD3BE;
    --agora-d1:#2E2610; --agora-d2:#3A2E10;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Archivo',system-ui,sans-serif;background:var(--fundo);color:var(--texto);
       font-size:16px;line-height:1.5;padding-bottom:50px;transition:background .3s,color .3s}
  .topo{background:var(--verde);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:8px}
  .topo h1{font-size:1.1rem;font-weight:700;flex:1}
  .btn-tema{background:rgba(255,255,255,.18);border:none;color:#fff;font-size:1.1rem;
    width:38px;height:38px;border-radius:10px;cursor:pointer}
  main{max-width:680px;margin:0 auto;padding:14px}

  /* ---- Cartão AGORA ---- */
  .agora{border-radius:16px;padding:16px;margin-bottom:16px;border:1px solid var(--linha)}
  .agora.diurno{background:linear-gradient(160deg,var(--agora-d1),var(--agora-d2))}
  .agora.noturno{background:linear-gradient(160deg,#232659,#3B3F8C);color:#EEF0FF}
  .agora-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .agora .rotulo{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
  .agora h2{font-size:1.1rem;font-weight:700;margin:2px 0 2px}
  .relogio{text-align:right}
  .relogio .hora{font-size:1.7rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
  .relogio .resta{font-size:.72rem;opacity:.8;font-variant-numeric:tabular-nums}
  .agora .grupo{margin-top:10px}
  .agora .setor-nome{font-size:.74rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;opacity:.7}
  .agora ul{list-style:none;margin-top:2px}
  .agora li{padding:2px 0;font-weight:500}
  .agora li .cron-apoio{display:block;font-size:.74rem;opacity:.85;font-variant-numeric:tabular-nums}
  .agora .vazio{opacity:.75;font-style:italic}

  /* ---- Seletor de setor ---- */
  .setores{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
  .setores::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;background:var(--chip);border:1px solid var(--linha);color:var(--texto-suave);
    padding:7px 14px;border-radius:99px;font-size:.85rem;font-weight:600;cursor:pointer;font-family:inherit}
  .chip.ativo{background:var(--verde);border-color:var(--verde);color:#fff}

  /* ---- Navegação de mês ---- */
  .mes-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .mes-nav button{background:var(--card);border:1px solid var(--linha);border-radius:10px;
    width:40px;height:40px;font-size:1.05rem;color:var(--verde);cursor:pointer}
  .mes-nav .mes-titulo{font-weight:700;font-size:1rem;text-transform:capitalize}

  /* ---- Calendário em grade ---- */
  .cal{background:var(--card);border:1px solid var(--linha);border-radius:14px;overflow:hidden}
  .cal-cab{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--linha)}
  .cal-cab div{text-align:center;font-size:.68rem;font-weight:700;color:var(--texto-suave);
    padding:6px 0;text-transform:uppercase}
  .cal-grade{display:grid;grid-template-columns:repeat(7,1fr)}
  .cel{min-height:74px;border-bottom:1px solid var(--linha);border-right:1px solid var(--linha);
    padding:3px 3px 4px;cursor:pointer;overflow:hidden}
  .cel:nth-child(7n){border-right:none}
  .cel.fora{background:transparent;cursor:default}
  .cel .num{font-size:.72rem;font-weight:700;color:var(--texto-suave)}
  .cel.hoje .num{background:var(--verde);color:#fff;border-radius:99px;padding:1px 6px;display:inline-block}
  .cel .lin{font-size:.6rem;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    border-radius:4px;padding:0 3px;margin-top:2px}
  .cel .lin.d{background:var(--sol-bg);color:var(--sol-tx)}
  .cel .lin.n{background:var(--lua-bg);color:var(--lua-tx)}
  .cel .lin.a{background:var(--apoio-bg);color:var(--apoio-tx)}
  .legenda{display:flex;gap:14px;justify-content:center;font-size:.7rem;color:var(--texto-suave);margin-top:8px}
  .legenda span::before{content:'';display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}
  .legenda .ld::before{background:var(--sol-bg);border:1px solid var(--sol-borda)}
  .legenda .ln::before{background:var(--lua-bg);border:1px solid var(--lua-borda)}
  .legenda .la::before{background:var(--apoio-bg)}

  /* ---- Detalhe do dia (janela) ---- */
  .fundo-modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;
    align-items:flex-end;justify-content:center;z-index:50}
  .fundo-modal.aberto{display:flex}
  .modal{background:var(--card);width:100%;max-width:680px;max-height:80vh;overflow-y:auto;
    border-radius:18px 18px 0 0;padding:16px}
  .modal-cab{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .modal-cab h3{font-size:1.05rem;text-transform:capitalize}
  .fechar{background:var(--chip);border:1px solid var(--linha);border-radius:10px;color:var(--texto);
    width:34px;height:34px;font-size:1rem;cursor:pointer}
  .turno-bloco{margin-top:10px}
  .turno-badge{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;padding:3px 10px;border-radius:99px}
  .turno-badge.diurno{background:var(--sol-bg);color:var(--sol-tx)}
  .turno-badge.noturno{background:var(--lua-bg);color:var(--lua-tx)}
  .turno-badge.apoio{background:var(--apoio-bg);color:var(--apoio-tx)}
  .setor-linha{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--linha);font-size:.92rem}
  .setor-linha:last-child{border-bottom:none}
  .setor-rotulo{min-width:112px;color:var(--texto-suave);font-size:.8rem;padding-top:2px}
  .medicos-lista{flex:1}
  .troca-nota{display:block;font-size:.73rem;color:var(--texto-suave)}
  .msg{background:var(--card);border:1px dashed var(--linha);border-radius:12px;
    padding:18px;text-align:center;color:var(--texto-suave)}
  footer{text-align:center;font-size:.7rem;color:var(--texto-suave);margin-top:20px}

  /* ---- Solicitação de troca ---- */
  .fab{position:fixed;right:16px;bottom:16px;background:var(--verde);color:#fff;border:none;
    border-radius:99px;padding:14px 20px;font-size:.95rem;font-weight:700;font-family:inherit;
    box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;z-index:40}
  .campo{margin-top:12px}
  .campo label{display:block;font-size:.8rem;font-weight:700;color:var(--texto-suave);margin-bottom:4px}
  .campo input,.campo select,.campo textarea{width:100%;background:var(--fundo);
    border:1px solid var(--linha);border-radius:10px;padding:10px;font-family:inherit;
    font-size:.95rem;color:var(--texto)}
  .campo textarea{min-height:70px;resize:vertical}
  .btn-enviar{width:100%;margin-top:16px;background:var(--verde);color:#fff;border:none;
    border-radius:12px;padding:13px;font-size:1rem;font-weight:700;font-family:inherit;cursor:pointer}
  .btn-enviar:disabled{opacity:.6}
  .aviso{margin-top:10px;font-size:.82rem;border-radius:10px;padding:10px;display:none}
  .aviso.erro{background:#FDE8E8;color:#9B1C1C;display:block}
  .aviso.ok{background:#DEF7EC;color:#03543F;display:block}
  .aviso.atencao{background:#FDF6B2;color:#723B13;display:block}
  body[data-tema="escuro"] .aviso.erro{background:#3B1219;color:#F8B4B4}
  body[data-tema="escuro"] .aviso.ok{background:#0E2E25;color:#84E1BC}
  body[data-tema="escuro"] .aviso.atencao{background:#372A12;color:#FCE96A}
</style>
</head>
<body>
<header class="topo">
  <h1>Escala UPA</h1>
  <button class="btn-tema" id="btn-tema" aria-label="Alternar tema">🌙</button>
</header>
<main>
  <section id="agora" class="agora diurno">
    <div class="agora-cab">
      <div>
        <div class="rotulo">De plantão agora</div>
        <h2 id="agora-titulo">Carregando…</h2>
      </div>
      <div class="relogio">
        <div class="hora" id="relogio-hora">--:--</div>
        <div class="resta" id="relogio-resta"></div>
      </div>
    </div>
    <div id="agora-conteudo"></div>
  </section>

  <div class="setores" id="setores-chips"></div>

  <div class="mes-nav">
    <button id="mes-ant" aria-label="Mês anterior">‹</button>
    <div class="mes-titulo" id="mes-titulo"></div>
    <button id="mes-prox" aria-label="Próximo mês">›</button>
  </div>

  <div id="calendario"><div class="msg">Carregando escala…</div></div>
  <div class="legenda">
    <span class="ld">Diurno</span><span class="ln">Noturno</span><span class="la">Apoio</span>
  </div>
  <footer>Escala de Plantões UPA · v0.3</footer>
</main>

<button class="fab" id="btn-troca">⇄ Solicitar troca</button>

<div class="fundo-modal" id="fundo-troca">
  <div class="modal">
    <div class="modal-cab">
      <h3 style="text-transform:none">Solicitar troca de plantão</h3>
      <button class="fechar" id="troca-fechar">✕</button>
    </div>
    <div class="campo">
      <label for="t-data">Data do plantão</label>
      <input type="date" id="t-data">
    </div>
    <div class="campo">
      <label for="t-plantao">Plantão original</label>
      <select id="t-plantao"><option value="">Escolha a data primeiro</option></select>
    </div>
    <div class="campo">
      <label for="t-assume">Médico que assume</label>
      <input type="text" id="t-assume" list="lista-medicos" placeholder="Digite para buscar pelo nome…" autocomplete="off">
      <datalist id="lista-medicos"></datalist>
    </div>
    <div class="campo">
      <label for="t-motivo">Motivo (opcional)</label>
      <textarea id="t-motivo" placeholder="Ex.: consulta, viagem, atestado…"></textarea>
    </div>
    <div class="aviso" id="t-aviso"></div>
    <button class="btn-enviar" id="t-enviar">Enviar solicitação</button>
  </div>
</div>

<div class="fundo-modal" id="fundo-modal">
  <div class="modal">
    <div class="modal-cab">
      <h3 id="modal-titulo"></h3>
      <button class="fechar" id="modal-fechar">✕</button>
    </div>
    <div id="modal-corpo"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ================== CONFIGURAÇÃO ================== */
const SUPABASE_URL = "https://tujryfvqfbaspdxkaccc.supabase.co";
const SUPABASE_KEY = "sb_publishable_SI1_j-fjtTLzJMNaLGPNaQ_Xap0IrGt";
const INICIO_DIURNO = 7;   // diurno: 07:00 -> 19:00
const INICIO_NOTURNO = 19; // noturno: 19:00 -> 07:00
/* ================================================== */

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let medicos = {}, setores = [], setorSel = null;
let mesAtual = new Date(); mesAtual.setDate(1);
let plantoesMes = [], plantoesAgora = [];

const isoData = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const nomeMedico = id => medicos[id] ? medicos[id].nome_completo : '—';
function nomeCurto(id){
  if(!medicos[id]) return '—';
  const p = medicos[id].nome_completo.trim().split(/\s+/);
  return /^dr[a]?\.?$/i.test(p[0]) && p[1] ? p[0]+' '+p[1] : p[0];
}

/* ---------- TEMA ---------- */
function aplicarTema(t){
  document.body.dataset.tema = t;
  document.getElementById('btn-tema').textContent = t==='escuro' ? '☀️' : '🌙';
  try{ localStorage.setItem('tema-upa', t); }catch(e){}
}
document.getElementById('btn-tema').onclick = () =>
  aplicarTema(document.body.dataset.tema==='escuro' ? 'claro' : 'escuro');
try{ aplicarTema(localStorage.getItem('tema-upa') || 'claro'); }catch(e){ aplicarTema('claro'); }

/* ---------- TURNO ATUAL E CONTAGENS ---------- */
function turnoAgora(){
  const agora = new Date(), h = agora.getHours();
  if(h >= INICIO_DIURNO && h < INICIO_NOTURNO) return {data:new Date(agora), turno:'diurno'};
  const d = new Date(agora);
  if(h < INICIO_DIURNO) d.setDate(d.getDate()-1);
  return {data:d, turno:'noturno'};
}
function fimDoTurno(){
  const {data,turno} = turnoAgora();
  const fim = new Date(data);
  if(turno==='diurno'){ fim.setHours(INICIO_NOTURNO,0,0,0); }
  else { fim.setDate(fim.getDate()+1); fim.setHours(INICIO_DIURNO,0,0,0); }
  return fim;
}
function faltam(ate){
  let ms = ate - new Date();
  if(ms <= 0) return 'encerrado';
  const h = Math.floor(ms/3600000), m = Math.floor(ms%3600000/60000);
  return (h>0 ? h+'h ' : '') + String(m).padStart(2,'0') + 'min';
}
function tick(){
  const agora = new Date();
  document.getElementById('relogio-hora').textContent =
    agora.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const fim = fimDoTurno();
  document.getElementById('relogio-resta').textContent =
    'turno até '+fim.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+' · faltam '+faltam(fim);
  document.querySelectorAll('[data-fim-apoio]').forEach(el=>{
    const f = new Date(el.dataset.fimApoio);
    el.textContent = 'apoio até '+f.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+' · faltam '+faltam(f);
  });
  const h = agora.getHours();
  const turnoVirou = (h===INICIO_DIURNO || h===INICIO_NOTURNO) && agora.getMinutes()===0 && agora.getSeconds()<2;
  if(turnoVirou) renderAgora();
}
setInterval(tick, 1000);

/* ---------- DADOS ---------- */
async function carregarBase(){
  const [m,s] = await Promise.all([
    db.from('medicos_publico').select('*'),
    db.from('setores').select('*').order('ordem')
  ]);
  (m.data||[]).forEach(x => medicos[x.id]=x);
  setores = s.data||[];
  setorSel = setores.length ? setores[0].id : null;
}

/* ---------- CARTÃO AGORA ---------- */
async function renderAgora(){
  const {data,turno} = turnoAgora();
  const el = document.getElementById('agora');
  el.className = 'agora '+turno;
  document.getElementById('agora-titulo').textContent =
    (turno==='diurno'?'☀️ Diurno':'🌙 Noturno')+' · '+
    data.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
  const {data:ps} = await db.from('plantoes').select('*')
    .eq('data', isoData(data)).in('turno',[turno,'apoio']);
  plantoesAgora = ps||[];
  const alvo = document.getElementById('agora-conteudo');
  const agoraHM = new Date().toTimeString().slice(0,5);
  const ativos = plantoesAgora.filter(p => p.turno!=='apoio' ||
    (p.hora_inicio && p.hora_inicio.slice(0,5)<=agoraHM && (p.hora_fim||'23:59').slice(0,5)>=agoraHM));
  if(!ativos.length){
    alvo.innerHTML = '<div class="vazio">Nenhum plantão cadastrado para este turno ainda.</div>';
    tick(); return;
  }
  alvo.innerHTML = setores.map(s=>{
    const doSetor = ativos.filter(p=>p.setor_id===s.id);
    if(!doSetor.length) return '';
    return '<div class="grupo"><div class="setor-nome">'+s.nome+'</div><ul>'+
      doSetor.map(p=>{
        let extra='';
        if(p.turno==='apoio' && p.hora_fim){
          const f = p.data+'T'+p.hora_fim;
          extra = '<span class="cron-apoio" data-fim-apoio="'+f+'"></span>';
        }
        return '<li>'+(p.medico_id?nomeMedico(p.medico_id):'<i>vaga em aberto</i>')+extra+'</li>';
      }).join('')+'</ul></div>';
  }).join('');
  tick();
}

/* ---------- CHIPS DE SETOR ---------- */
function renderChips(){
  document.getElementById('setores-chips').innerHTML = setores.map(s=>
    '<button class="chip'+(s.id===setorSel?' ativo':'')+'" data-setor="'+s.id+'">'+s.nome+'</button>'
  ).join('');
  document.querySelectorAll('.chip').forEach(c=>{
    c.onclick = ()=>{ setorSel = parseInt(c.dataset.setor); renderChips(); renderCalendario(); };
  });
}

/* ---------- CALENDÁRIO EM GRADE ---------- */
async function carregarMes(){
  const y=mesAtual.getFullYear(), m=mesAtual.getMonth();
  const ini = new Date(y,m,1), fim = new Date(y,m+1,0);
  const {data:ps,error} = await db.from('plantoes').select('*')
    .gte('data',isoData(ini)).lte('data',isoData(fim)).order('data');
  plantoesMes = error ? [] : (ps||[]);
  renderCalendario();
}
function renderCalendario(){
  const y=mesAtual.getFullYear(), m=mesAtual.getMonth();
  document.getElementById('mes-titulo').textContent =
    mesAtual.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  const primeiroDia = new Date(y,m,1).getDay();
  const totalDias = new Date(y,m+1,0).getDate();
  const hoje = isoData(new Date());
  let celulas = '';
  for(let i=0;i<primeiroDia;i++) celulas += '<div class="cel fora"></div>';
  for(let d=1;d<=totalDias;d++){
    const dia = y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const doDia = plantoesMes.filter(p=>p.data===dia && p.setor_id===setorSel);
    let linhas='';
    ['diurno','noturno','apoio'].forEach(t=>{
      const dt = doDia.filter(p=>p.turno===t);
      if(!dt.length) return;
      const cls = t==='diurno'?'d':(t==='noturno'?'n':'a');
      const icone = t==='diurno'?'☀':(t==='noturno'?'☾':'✚');
      const nomes = dt.map(p=>p.medico_id?nomeCurto(p.medico_id):'vaga').join(', ');
      linhas += '<div class="lin '+cls+'">'+icone+' '+nomes+'</div>';
    });
    celulas += '<div class="cel'+(dia===hoje?' hoje':'')+'" data-dia="'+dia+'">'+
      '<div class="num">'+d+'</div>'+linhas+'</div>';
  }
  document.getElementById('calendario').innerHTML =
    '<div class="cal"><div class="cal-cab"><div>dom</div><div>seg</div><div>ter</div><div>qua</div>'+
    '<div>qui</div><div>sex</div><div>sáb</div></div>'+
    '<div class="cal-grade">'+celulas+'</div></div>';
  document.querySelectorAll('.cel[data-dia]').forEach(c=>{
    c.onclick = ()=> abrirDia(c.dataset.dia);
  });
}

/* ---------- DETALHE DO DIA ---------- */
function abrirDia(dia){
  const dt = new Date(dia+'T12:00:00');
  document.getElementById('modal-titulo').textContent =
    dt.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
  const itens = plantoesMes.filter(p=>p.data===dia);
  let corpo='';
  ['diurno','noturno','apoio'].forEach(t=>{
    const doTurno = itens.filter(p=>p.turno===t);
    if(!doTurno.length) return;
    const linhas = setores.map(s=>{
      const ds = doTurno.filter(p=>p.setor_id===s.id);
      if(!ds.length) return '';
      return '<div class="setor-linha"><div class="setor-rotulo">'+s.nome+'</div>'+
        '<div class="medicos-lista">'+ds.map(p=>{
          let extra='';
          if(p.medico_original_id && p.medico_id && p.medico_original_id!==p.medico_id)
            extra='<span class="troca-nota">troca aprovada · antes: '+nomeMedico(p.medico_original_id)+'</span>';
          if(p.turno==='apoio' && p.hora_inicio)
            extra+='<span class="troca-nota">horário: '+p.hora_inicio.slice(0,5)+'–'+(p.hora_fim||'').slice(0,5)+'</span>';
          return '<div>'+(p.medico_id?nomeMedico(p.medico_id):'<i>vaga em aberto</i>')+extra+'</div>';
        }).join('')+'</div></div>';
    }).join('');
    corpo += '<div class="turno-bloco"><span class="turno-badge '+t+'">'+t+'</span>'+linhas+'</div>';
  });
  document.getElementById('modal-corpo').innerHTML = corpo || '<div class="msg">Sem plantões neste dia.</div>';
  document.getElementById('fundo-modal').classList.add('aberto');
}
document.getElementById('modal-fechar').onclick =
  ()=> document.getElementById('fundo-modal').classList.remove('aberto');
document.getElementById('fundo-modal').onclick = e=>{
  if(e.target.id==='fundo-modal') e.target.classList.remove('aberto');
};

/* ---------- SOLICITAR TROCA ---------- */
let trocaPlantoes = [];
const elFundoTroca = document.getElementById('fundo-troca');

document.getElementById('btn-troca').onclick = ()=>{
  document.getElementById('lista-medicos').innerHTML =
    Object.values(medicos).map(m=>'<option value="'+m.nome_completo+'">').join('');
  ['t-data','t-assume','t-motivo'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('t-plantao').innerHTML='<option value="">Escolha a data primeiro</option>';
  const av=document.getElementById('t-aviso'); av.className='aviso'; av.textContent='';
  document.getElementById('t-enviar').disabled=false;
  elFundoTroca.classList.add('aberto');
};
document.getElementById('troca-fechar').onclick = ()=> elFundoTroca.classList.remove('aberto');
elFundoTroca.onclick = e=>{ if(e.target.id==='fundo-troca') elFundoTroca.classList.remove('aberto'); };

document.getElementById('t-data').onchange = async function(){
  const sel = document.getElementById('t-plantao');
  sel.innerHTML = '<option value="">Carregando…</option>';
  const {data:ps} = await db.from('plantoes').select('*').eq('data', this.value);
  trocaPlantoes = (ps||[]).filter(p=>p.medico_id);
  if(!trocaPlantoes.length){
    sel.innerHTML = '<option value="">Nenhum plantão nesta data</option>'; return;
  }
  sel.innerHTML = '<option value="">Selecione…</option>'+trocaPlantoes.map(p=>{
    const s = setores.find(x=>x.id===p.setor_id);
    const hor = p.turno==='apoio' && p.hora_inicio
      ? ' ('+p.hora_inicio.slice(0,5)+'–'+(p.hora_fim||'').slice(0,5)+')' : '';
    return '<option value="'+p.id+'">'+(s?s.nome:'?')+' · '+p.turno+hor+' · '+nomeMedico(p.medico_id)+'</option>';
  }).join('');
};

function fimDoPlantao(p){
  const f = new Date(p.data+'T12:00:00');
  if(p.turno==='diurno'){ f.setHours(INICIO_NOTURNO,0,0,0); }
  else if(p.turno==='noturno'){ f.setDate(f.getDate()+1); f.setHours(INICIO_DIURNO,0,0,0); }
  else if(p.hora_fim){ const [h,m]=p.hora_fim.split(':'); f.setHours(+h,+m,0,0); }
  return f;
}

document.getElementById('t-enviar').onclick = async ()=>{
  const av = document.getElementById('t-aviso');
  const mostrar=(cls,txt)=>{ av.className='aviso '+cls; av.textContent=txt; };
  const pid = document.getElementById('t-plantao').value;
  const nomeAssume = document.getElementById('t-assume').value.trim();
  const motivo = document.getElementById('t-motivo').value.trim();
  const p = trocaPlantoes.find(x=>x.id===pid);
  if(!p) return mostrar('erro','Selecione a data e o plantão original.');
  const assume = Object.values(medicos).find(m=>m.nome_completo===nomeAssume);
  if(!assume) return mostrar('erro','Escolha o médico que assume tocando num nome da lista.');
  if(assume.id===p.medico_id) return mostrar('erro','O médico que assume não pode ser o mesmo já escalado.');
  if(fimDoPlantao(p) < new Date()) return mostrar('erro','Este plantão já passou — não é possível solicitar troca.');
  const btn = document.getElementById('t-enviar');
  btn.disabled = true; mostrar('atencao','Enviando…');
  const {data:mesmoTurno} = await db.from('plantoes').select('id')
    .eq('data',p.data).eq('turno',p.turno).eq('medico_id',assume.id);
  const conflito = (mesmoTurno||[]).length > 0;
  const {error} = await db.from('trocas').insert({
    plantao_id: p.id, medico_original_id: p.medico_id,
    medico_assume_id: assume.id, motivo: motivo || null, status:'pendente'
  });
  if(error){ btn.disabled=false; return mostrar('erro','Erro ao enviar: '+error.message); }
  await db.from('auditoria').insert({
    evento:'solicitacao_troca', autor:'visão pública',
    detalhes:{ plantao_id:p.id, data:p.data, turno:p.turno,
      original:nomeMedico(p.medico_id), assume:assume.nome_completo,
      conflito_mesmo_turno:conflito }
  });
  mostrar('ok','Solicitação enviada! Ela vale somente após aprovação da coordenação.'+
    (conflito ? ' Atenção: esse médico já tem plantão nesse turno — a coordenação será alertada.' : ''));
  setTimeout(()=> elFundoTroca.classList.remove('aberto'), 3500);
};

/* ---------- NAVEGAÇÃO ---------- */
document.getElementById('mes-ant').onclick = ()=>{ mesAtual.setMonth(mesAtual.getMonth()-1); carregarMes(); };
document.getElementById('mes-prox').onclick = ()=>{ mesAtual.setMonth(mesAtual.getMonth()+1); carregarMes(); };

(async ()=>{ await carregarBase(); renderChips(); renderAgora(); carregarMes(); })();
</script>
